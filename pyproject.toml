[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "arthurgaillard", email = "arthur.gaillard@hec.edu" },
  { name = "TabErica", email = "ziqi.meng@hec.edu" },
  { name = "Anais", email = "anais.storp@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">3.10" # TODO: update this version
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.1",
]
